name: macOS Client CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    name: Build & Test (macOS 26)
    runs-on: macos-26
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Check Swift & Xcode Version
        run: |
          swift --version
          xcodebuild -version

      - name: Verify Zero Hardcoded Hex Colors in Swift Code
        run: |
          if grep -rnE '#[0-9A-Fa-f]{6}\b' LooseLeaf/; then
            echo "Found hardcoded hex color literal in Swift code! Use Assets.xcassets semantic colors instead."
            exit 1
          fi

      - name: Build Debug Target
        run: swift build -Xswiftc -warnings-as-errors

      - name: Swift 6 Strict Concurrency Check
        run: |
          # Swift 6 语言模式下的并发违规会以 error 级别暴露。
          # 当前工程仍锁定 Swift 5 语言模式，因此用独立检查项确保技术债不继续累积。
          swift build -Xswiftc -strict-concurrency=complete \
            -Xswiftc -warnings-as-errors || {
            echo "Swift 6 strict concurrency violations detected. Please fix the reported issues."
            exit 1
          }

      - name: Validate Info.plist Required Keys
        run: |
          python3 scripts/check_info_plist.py LooseLeaf/Info.plist

      - name: Verify Color Contrast (WCAG AA)
        run: |
          python3 scripts/check_color_contrast.py LooseLeaf/Resources/Assets.xcassets

      - name: Fetch Web Repository (for city dictionary cross-check)
        run: |
          set -euo pipefail
          # 用匿名浅克隆而非 actions/checkout：跨仓库 checkout 在受限令牌下会失败，
          # 而 web 仓库本身是公开的，浅克隆即可拿到城市字典真源。
          WEB_DIR="${RUNNER_TEMP}/web"
          rm -rf "${WEB_DIR}"
          git clone --depth 1 --quiet https://github.com/Losse-Leaf/web.git "${WEB_DIR}"
          test -f "${WEB_DIR}/src/utils/cities.ts"
          echo "WEB_DIR=${WEB_DIR}" >> "${GITHUB_ENV}"

      - name: Verify City Dictionary Consistency (macOS vs Web)
        run: |
          python3 scripts/check_city_dictionary.py \
            LooseLeaf/Models/CityDictionary.swift "${WEB_DIR}/src/utils/cities.ts"

      - name: Run Unit Tests
        run: swift test --verbose

      - name: Verify Snapshot Baselines Are Committed
        run: |
          # 快照基准图必须入库：缺失说明有人改了视觉却没更新基准
          if [ ! -d LooseLeafTests/__Snapshots__ ]; then
            echo "Missing LooseLeafTests/__Snapshots__ directory"
            exit 1
          fi
          COUNT=$(ls -1 LooseLeafTests/__Snapshots__/*.png 2>/dev/null | wc -l | tr -d ' ')
          if [ "$COUNT" -lt 1 ]; then
            echo "No snapshot baselines found"
            exit 1
          fi
          if [ ! -f LooseLeafTests/__Snapshots__/manifest.json ]; then
            echo "Missing snapshot environment manifest"
            exit 1
          fi
          echo "Snapshot baselines present: $COUNT (+ manifest)"

      - name: Build Release App Bundle (unsigned)
        run: |
          xcodebuild -project LooseLeaf.xcodeproj -target LooseLeaf -configuration Release \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            SYMROOT=build/Sym build

      - name: Upload App Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LooseLeaf-macOS-arm64
          path: build/Sym/Release/LooseLeaf.app
          retention-days: 30
