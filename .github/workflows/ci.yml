name: macOS Client CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    name: Build & Test (Tauri v2 · macOS)
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Dependencies
        run: npm ci

      - name: Run Unit Tests
        run: npm test

      - name: Typecheck & Build Frontend
        run: npm run build

      - name: Check Rust Crate
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Build Tauri macOS App Bundle
        run: npm run tauri build -- --bundles app

      - name: Package App Archive
        run: |
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent \
            src-tauri/target/release/bundle/macos/LooseLeaf.app \
            dist/LooseLeaf-macOS-arm64.zip

      - name: Upload App Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LooseLeaf-macOS-arm64
          path: dist/LooseLeaf-macOS-arm64.zip
          retention-days: 30
