name: macOS Release

on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:

jobs:
  build-release:
    name: Build Release App Bundle (unsigned)
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Dependencies & Run Tests
        run: |
          npm ci
          npm test

      - name: Build Tauri macOS App Bundle
        run: npm run tauri build -- --bundles app

      - name: Package Release Archive
        run: |
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent \
            src-tauri/target/release/bundle/macos/LooseLeaf.app \
            "dist/LooseLeaf-${{ github.ref_name }}-arm64.zip"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LooseLeaf-unsigned-app
          path: dist/LooseLeaf-*.zip

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/LooseLeaf-*.zip
          body: |
            未签名构建产物（macOS arm64，免 Developer ID 下载即用；Gatekeeper 首次打开请右键 →「打开」）。

            正式分发前请在本机完成签名与公证（需要 Developer ID 证书）：
            ```
            codesign --deep --force --options runtime --sign "Developer ID Application: <你的证书>" LooseLeaf.app
            xcrun notarytool submit LooseLeaf.app.zip --keychain-profile <profile> --wait
            xcrun stapler staple LooseLeaf.app
            ```
