name: macOS Release

on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:

jobs:
  build-release:
    name: Build Release App Bundle (unsigned)
    runs-on: macos-26
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Check Swift & Xcode Version
        run: |
          swift --version
          xcodebuild -version

      # 统一走 scripts/package_release.sh：中间产物进临时目录、用完即删，
      # 只把最终 zip 留在 dist/。这样本机手动跑同一条命令也不会残留一堆
      # LooseLeaf.app 与旧 zip（那正是 Spotlight 里搜出七八个副本的由来）。
      - name: Build & Package App Bundle (unsigned)
        run: |
          scripts/package_release.sh \
            --tag "${{ github.ref_name }}" \
            --output-dir "$GITHUB_WORKSPACE/dist"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LooseLeaf-unsigned-app
          path: dist/LooseLeaf-*.zip

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/LooseLeaf-*.zip
          body: |
            未签名构建产物（macOS arm64，免 Developer ID 下载即用；Gatekeeper 首次打开请右键 →「打开」）。

            正式分发前请在本机完成签名与公证（需要 Developer ID 证书）：
            ```
            codesign --deep --force --options runtime --sign "Developer ID Application: <你的证书>" LooseLeaf.app
            xcrun notarytool submit LooseLeaf.app.zip --keychain-profile <profile> --wait
            xcrun stapler staple LooseLeaf.app
            ```
