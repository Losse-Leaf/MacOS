[package]
name = "looseleaf-desktop"
version = "4.1.0"
description = "散页 Loose-Leaf macOS 极简桌面工作台"
authors = ["YN1753"]
edition = "2021"

[lib]
name = "looseleaf_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-deep-link = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
